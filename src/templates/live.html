{% extends "base.html" %}
{% block title %}Vista en Vivo{% endblock %}
{% block page_title %}Vista en Vivo{% endblock %}

{% block content %}
<div class="grid" style="grid-template-columns: 2fr 1fr; align-items: start;">
  <div>
    <div class="video-wrap" id="videoWrap">
      <div class="video-placeholder" id="videoPlaceholder">Esperando señal de la cámara…</div>
      <img src="{{ url_for('video_feed') }}" alt="Transmisión en vivo de la cámara" id="videoImg">
    </div>
    <div id="cameraStatusBanner" style="display:none; margin-top: 10px;">
      <span class="badge badge-out_of_stock">● Cámara no disponible</span>
    </div>
  </div>

  <div>
    <div class="grid" id="zoneCards" style="grid-template-columns: 1fr;">
      <div class="empty-state">
        <div class="empty-title">Cargando zonas…</div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const ESTADO_LABEL = { in_stock: 'Con stock', out_of_stock: 'Sin stock' };

  function renderZoneCard(zone, cameraAvailable) {
    const state = zone.current_state || 'in_stock';
    const count = zone.latest_count;

    let countDisplay;
    if (!cameraAvailable) {
      // Cámara desconectada/no disponible: el conteo se muestra en 0,
      // nunca se arrastra el último valor conocido (sería engañoso).
      countDisplay = `0<span class="unit">botellas</span>`;
    } else if (count !== null && count !== undefined) {
      countDisplay = `${count}<span class="unit">botellas</span>`;
    } else {
      countDisplay = `<span style="font-size:15px; color: var(--text-tertiary); font-weight:400;">Sin lecturas aún</span>`;
    }

    return `
      <div class="shelf-tag state-${state}">
        <span class="tag-name">${zone.name}</span>
        <div class="tag-count">${countDisplay}</div>
        <div class="led-row">
          <span class="led-dot"></span>
          ${ESTADO_LABEL[state] || state}
        </div>
      </div>
    `;
  }

  function updateCameraUi(available) {
    const placeholder = document.getElementById('videoPlaceholder');
    const banner = document.getElementById('cameraStatusBanner');

    if (available) {
      placeholder.style.display = 'none';
      banner.style.display = 'none';
    } else {
      placeholder.textContent = 'Cámara no disponible';
      placeholder.style.display = 'flex';
      banner.style.display = 'block';
    }
  }

  async function refreshAll() {
    const container = document.getElementById('zoneCards');
    try {
      const [statusResp, zonesResp] = await Promise.all([
        fetch('/api/camera_status'),
        fetch('/api/roi_zones'),
      ]);
      if (statusResp.status === 401 || zonesResp.status === 401) {
        window.location.href = '/login';
        return;
      }

      const status = await statusResp.json();
      const zones = await zonesResp.json();

      updateCameraUi(status.available);

      if (!zones.length) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-title">Todavía no hay zonas configuradas</div>
            <div>Ve a Configuración ROI para crear la primera.</div>
          </div>`;
        return;
      }
      container.innerHTML = zones.map((z) => renderZoneCard(z, status.available)).join('');
    } catch (err) {
      container.innerHTML = `<div class="empty-state">No se pudo conectar con el sistema.</div>`;
    }
  }

  refreshAll();
  setInterval(refreshAll, 2000);
</script>
{% endblock %}
