<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión — Monitoreo de Góndolas</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="brand-line"></div>
      <h1>Monitoreo de Góndolas</h1>
      <span class="subtitle">UEES · Proyecto Integrador en IA</span>

      <form id="loginForm">
        <div class="login-error" id="loginError"></div>
        <div class="field">
          <label for="username">Usuario</label>
          <input type="text" id="username" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <div class="login-links">
          <a href="#" id="forgotPasswordLink">¿Olvidaste tu contraseña?</a>
        </div>
        <button type="submit" class="btn btn-primary">Ingresar</button>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('loginError');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorEl.textContent = '';

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const resp = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });

        if (!resp.ok) {
          const data = await resp.json().catch(() => ({}));
          errorEl.textContent = data.error || 'No se pudo iniciar sesión. Intenta de nuevo.';
          return;
        }

        window.location.href = '/';
      } catch (err) {
        errorEl.textContent = 'No se pudo conectar con el sistema. Verifica la red.';
      }
    });

    // RF-02: flujo de recuperación de contraseña — placeholder hasta que
    // se implemente el endpoint de envío de token por correo.
    document.getElementById('forgotPasswordLink').addEventListener('click', (event) => {
      event.preventDefault();
      errorEl.textContent = 'Recuperación de contraseña: contacta al administrador del sistema.';
    });
  </script>
</body>
</html>
