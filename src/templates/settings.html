{% extends "base.html" %}
{% block title %}Configuración{% endblock %}
{% block page_title %}Configuración{% endblock %}

{% block content %}
<div class="tabs">
  <button class="tab-btn active" data-tab="general">General</button>
  <button class="tab-btn" data-tab="smtp">Notificaciones (SMTP)</button>
  <button class="tab-btn" data-tab="recipients">Destinatarios</button>
  <button class="tab-btn" data-tab="users">Usuarios</button>
</div>

<div class="tab-panel active" id="tab-general">
  <div class="card" style="max-width: 520px;">
    <div id="paramsList"></div>
  </div>
</div>

<div class="tab-panel" id="tab-smtp">
  <div class="card" style="max-width: 520px;">
    <div class="field">
      <label for="smtpServer">Servidor SMTP</label>
      <input type="text" id="smtpServer" placeholder="smtp.ejemplo.com">
    </div>
    <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 12px;">
      <div class="field">
        <label for="smtpPort">Puerto</label>
        <input type="number" id="smtpPort" placeholder="587">
      </div>
      <div class="field">
        <label for="smtpUsername">Usuario</label>
        <input type="text" id="smtpUsername" placeholder="alertas@ejemplo.com">
      </div>
    </div>
    <div class="field">
      <label for="smtpPassword">Contraseña</label>
      <input type="password" id="smtpPassword" placeholder="Dejar vacío para no cambiarla">
    </div>
    <button class="btn btn-primary" id="saveSmtpBtn">Guardar configuración</button>
    <div class="form-status" id="smtpSaveStatus"></div>

    <div style="border-top: 1px solid var(--border-hairline); margin-top: 20px; padding-top: 16px;">
      <div class="field">
        <label for="testEmailTo">Correo de destino para prueba</label>
        <input type="text" id="testEmailTo" placeholder="tu_correo@ejemplo.com">
      </div>
      <button class="btn" id="testSmtpBtn">Probar conexión</button>
      <div class="form-status" id="smtpTestStatus"></div>
    </div>
  </div>
</div>

<div class="tab-panel" id="tab-recipients">
  <div class="card" style="max-width: 520px;">
    <div style="display:flex; gap:10px; margin-bottom: 16px;">
      <input type="text" id="newRecipientEmail" placeholder="correo@ejemplo.com" style="flex:1;">
      <button class="btn btn-primary" id="addRecipientBtn">Agregar</button>
    </div>
    <div id="recipientsList"></div>
    <div class="form-status" id="recipientsStatus"></div>
  </div>
</div>

<div class="tab-panel" id="tab-users">
  <div class="card" style="max-width: 520px; margin-bottom: 20px;">
    <strong style="font-size:13px; display:block; margin-bottom:14px;">Cambiar mi contraseña</strong>
    <div class="field">
      <label for="currentPassword">Contraseña actual</label>
      <input type="password" id="currentPassword">
    </div>
    <div class="field">
      <label for="newPasswordSelf">Nueva contraseña</label>
      <input type="password" id="newPasswordSelf" placeholder="Mínimo 8 caracteres">
    </div>
    <button class="btn btn-primary" id="changeOwnPasswordBtn">Cambiar contraseña</button>
    <div class="form-status" id="ownPasswordStatus"></div>
  </div>

  <div class="card" style="max-width: 520px;">
    <strong style="font-size:13px; display:block; margin-bottom:14px;">Crear nuevo usuario</strong>
    <div class="field">
      <label for="newUsername">Usuario</label>
      <input type="text" id="newUsername">
    </div>
    <div class="field">
      <label for="newUserPassword">Contraseña</label>
      <input type="password" id="newUserPassword" placeholder="Mínimo 8 caracteres">
    </div>
    <button class="btn btn-primary" id="createUserBtn">Crear usuario</button>
    <div class="form-status" id="createUserStatus"></div>

    <div style="border-top: 1px solid var(--border-hairline); margin-top: 20px; padding-top: 16px;">
      <strong style="font-size:13px; display:block; margin-bottom:10px;">Usuarios existentes</strong>
      <div id="usersList"></div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.querySelectorAll(".tab-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
      document.querySelectorAll(".tab-panel").forEach((p) => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(`tab-${btn.dataset.tab}`).classList.add("active");
    });
  });

  const DESCRIPCIONES_AMIGABLES = {
    image_retention_days: "Días de retención de imágenes de eventos",
    reading_average_window: "Cantidad de lecturas para el promedio móvil",
    default_confirmation_readings: "Lecturas de confirmación por defecto en zonas nuevas",
  };

  async function loadGeneralParameters() {
    const resp = await fetch("/api/general_parameters");
    if (resp.status === 401) { window.location.href = "/login"; return; }
    const params = await resp.json();

    const container = document.getElementById("paramsList");
    container.innerHTML = params.map((p) => `
      <div class="field">
        <label>${DESCRIPCIONES_AMIGABLES[p.key] || p.description || p.key}</label>
        <input type="text" data-key="${p.key}" value="${p.value}">
      </div>
    `).join("");

    container.querySelectorAll("input[data-key]").forEach((input) => {
      input.addEventListener("change", async () => {
        await fetch(`/api/general_parameters/${input.dataset.key}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ value: input.value }),
        });
      });
    });
  }

  async function loadSmtpConfig() {
    const resp = await fetch("/api/smtp_config");
    if (resp.status === 401) { window.location.href = "/login"; return; }
    const config = await resp.json();
    if (!config) return;
    document.getElementById("smtpServer").value = config.server || "";
    document.getElementById("smtpPort").value = config.port || "";
    document.getElementById("smtpUsername").value = config.username || "";
  }

  document.getElementById("saveSmtpBtn").addEventListener("click", async () => {
    const statusEl = document.getElementById("smtpSaveStatus");
    statusEl.textContent = "";
    statusEl.className = "form-status";

    const payload = {
      server: document.getElementById("smtpServer").value.trim(),
      port: parseInt(document.getElementById("smtpPort").value, 10),
      username: document.getElementById("smtpUsername").value.trim(),
      password: document.getElementById("smtpPassword").value,
    };

    const resp = await fetch("/api/smtp_config", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await resp.json().catch(() => ({}));

    if (!resp.ok) {
      statusEl.textContent = data.error || "No se pudo guardar la configuración.";
      statusEl.className = "form-status error";
      return;
    }
    statusEl.textContent = "Configuración guardada correctamente.";
    statusEl.className = "form-status success";
    document.getElementById("smtpPassword").value = "";
  });

  document.getElementById("testSmtpBtn").addEventListener("click", async () => {
    const statusEl = document.getElementById("smtpTestStatus");
    const destino = document.getElementById("testEmailTo").value.trim();
    if (!destino) {
      statusEl.textContent = "Ingresa un correo de destino.";
      statusEl.className = "form-status error";
      return;
    }

    statusEl.textContent = "Enviando…";
    statusEl.className = "form-status";

    const resp = await fetch("/api/smtp_config/test", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ test_recipient: destino }),
    });
    const data = await resp.json().catch(() => ({}));

    if (!resp.ok) {
      statusEl.textContent = data.error || "No se pudo enviar el correo de prueba.";
      statusEl.className = "form-status error";
      return;
    }
    statusEl.textContent = `Correo de prueba enviado a ${destino}.`;
    statusEl.className = "form-status success";
  });

  function renderRecipientRow(email) {
    return `
      <div class="recipient-row">
        <span>${email}</span>
        <button class="btn btn-danger" style="font-size:11px; padding:4px 8px;" data-remove="${email}">Eliminar</button>
      </div>
    `;
  }

  async function loadRecipients() {
    const resp = await fetch("/api/alert_recipients");
    if (resp.status === 401) { window.location.href = "/login"; return; }
    const emails = await resp.json();

    const container = document.getElementById("recipientsList");
    container.innerHTML = emails.length
      ? emails.map(renderRecipientRow).join("")
      : `<div class="empty-state"><div class="empty-title">Sin destinatarios todavía</div>Agrega el primero arriba.</div>`;

    container.querySelectorAll("[data-remove]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        await fetch(`/api/alert_recipients/${encodeURIComponent(btn.dataset.remove)}`, { method: "DELETE" });
        await loadRecipients();
      });
    });
  }

  document.getElementById("addRecipientBtn").addEventListener("click", async () => {
    const input = document.getElementById("newRecipientEmail");
    const statusEl = document.getElementById("recipientsStatus");
    const email = input.value.trim();
    if (!email) return;

    const resp = await fetch("/api/alert_recipients", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email }),
    });

    if (!resp.ok) {
      statusEl.textContent = "No se pudo agregar el destinatario.";
      statusEl.className = "form-status error";
      return;
    }
    statusEl.textContent = "";
    input.value = "";
    await loadRecipients();
  });

  loadGeneralParameters();
  loadSmtpConfig();
  loadRecipients();

  // ---- Pestaña Usuarios ----

  function renderUserRow(user) {
    return `
      <div class="recipient-row" style="align-items:flex-start; flex-direction:column; gap:8px;">
        <div style="display:flex; justify-content:space-between; width:100%;">
          <span>${user.username}</span>
          <button class="btn btn-danger" style="font-size:11px; padding:4px 8px;" data-delete-user="${user.id}">Eliminar</button>
        </div>
        <div style="display:flex; gap:8px; width:100%;">
          <input type="password" placeholder="Nueva contraseña" data-reset-input="${user.id}" style="flex:1; font-size:12px; padding:6px 8px;">
          <button class="btn" style="font-size:11px; padding:4px 8px;" data-reset-user="${user.id}">Resetear</button>
        </div>
      </div>
    `;
  }

  async function loadUsers() {
    const resp = await fetch("/api/users");
    if (resp.status === 401) { window.location.href = "/login"; return; }
    const users = await resp.json();

    const container = document.getElementById("usersList");
    container.innerHTML = users.map(renderUserRow).join("");

    container.querySelectorAll("[data-delete-user]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const resp = await fetch(`/api/users/${btn.dataset.deleteUser}`, { method: "DELETE" });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) { alert(data.error || "No se pudo eliminar el usuario."); return; }
        await loadUsers();
      });
    });

    container.querySelectorAll("[data-reset-user]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const input = container.querySelector(`[data-reset-input="${btn.dataset.resetUser}"]`);
        const newPassword = input.value;
        const resp = await fetch(`/api/users/${btn.dataset.resetUser}/password`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ new_password: newPassword }),
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) { alert(data.error || "No se pudo cambiar la contraseña."); return; }
        input.value = "";
        alert("Contraseña actualizada.");
      });
    });
  }

  document.getElementById("createUserBtn").addEventListener("click", async () => {
    const statusEl = document.getElementById("createUserStatus");
    const username = document.getElementById("newUsername").value.trim();
    const password = document.getElementById("newUserPassword").value;

    const resp = await fetch("/api/users", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    const data = await resp.json().catch(() => ({}));

    if (!resp.ok) {
      statusEl.textContent = data.error || "No se pudo crear el usuario.";
      statusEl.className = "form-status error";
      return;
    }
    statusEl.textContent = `Usuario '${username}' creado.`;
    statusEl.className = "form-status success";
    document.getElementById("newUsername").value = "";
    document.getElementById("newUserPassword").value = "";
    await loadUsers();
  });

  document.getElementById("changeOwnPasswordBtn").addEventListener("click", async () => {
    const statusEl = document.getElementById("ownPasswordStatus");
    const current_password = document.getElementById("currentPassword").value;
    const new_password = document.getElementById("newPasswordSelf").value;

    const resp = await fetch("/api/users/me/password", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ current_password, new_password }),
    });
    const data = await resp.json().catch(() => ({}));

    if (!resp.ok) {
      statusEl.textContent = data.error || "No se pudo cambiar la contraseña.";
      statusEl.className = "form-status error";
      return;
    }
    statusEl.textContent = "Contraseña actualizada correctamente.";
    statusEl.className = "form-status success";
    document.getElementById("currentPassword").value = "";
    document.getElementById("newPasswordSelf").value = "";
  });

  loadUsers();
</script>
{% endblock %}
